server.port=8080

# ── Flagging thresholds (configurable per API Contract v3) ──────────────
sentinel.threshold.risk-score=0.70
sentinel.threshold.ring-score=0.60

# ── Python agent base URL ───────────────────────────────────────────────
sentinel.python-agent.base-url=http://localhost:8000

# ── False-positive cost defaults ────────────────────────────────────────
sentinel.cost.currency=USD
sentinel.cost.per-false-positive=50.0
