version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinel_admin
      MONGO_INITDB_ROOT_PASSWORD: sentinel_secret_2026
      MONGO_INITDB_DATABASE: sentinel_ring
    volumes:
      - sentinel_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sentinel_mongo_data:
    driver: local
